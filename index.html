<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Translator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container">
                <a class="navbar-brand fw-semibold" href="#">
                    <i class="bi bi-translate me-2"></i>Multi Translator
                </a>
            </div>
        </nav>
    </header>

    <main class="container my-4 my-md-5">
        <div class="text-center mb-4">
            <h1 class="h3">Multi Translator</h1>
            <p class="text-muted mb-0">Translate your text between different languages.</p>
        </div>

        <div id="message" class="alert d-none" role="alert" aria-live="polite"></div>

        <section class="card shadow-sm" aria-labelledby="translator-title">
            <div class="card-header bg-white">
                <h2 id="translator-title" class="h5 mb-0">
                    <i class="bi bi-translate me-2"></i>Translator
                </h2>
            </div>

            <div class="card-body">
                <form id="translator-form" novalidate>

                    <div class="row g-3">
                        <div class="col-md-5">
                            <label for="source-language" class="form-label">From</label>
                            <select id="source-language" class="form-select"></select>
                        </div>

                        <div class="col-md-2 d-flex align-items-end justify-content-center">
                            <button id="swap-languages" type="button"
                                    class="btn btn-outline-primary rounded-circle swap-button"
                                    title="Swap languages" aria-label="Swap languages">
                                <i class="bi bi-arrow-left-right"></i>
                            </button>
                        </div>

                        <div class="col-md-5">
                            <label for="target-language" class="form-label">To</label>
                            <select id="target-language" class="form-select"></select>
                        </div>
                    </div>

                    <div class="row g-3 mt-1">
                        <div class="col-lg-6">
                            <label for="input-text" class="form-label">Text</label>
                            <textarea id="input-text" class="form-control" rows="6"
                                      placeholder="Enter text to translate..." required></textarea>
                        </div>

                        <div class="col-lg-6">
                            <label for="result-text" class="form-label">Translation</label>
                            <textarea id="result-text" class="form-control bg-light" rows="6"
                                      placeholder="The translation will appear here..." readonly></textarea>
                        </div>
                    </div>

                    <div id="loading" class="d-none align-items-center mt-3" role="status" aria-live="polite">
                        <div class="spinner-border spinner-border-sm text-primary me-2" aria-hidden="true"></div>
                        <span>Translating...</span>
                    </div>

                    <div class="d-flex flex-wrap gap-2 mt-4">
                        <button id="translate-button" type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-translate me-1"></i>Translate
                        </button>

                        <button id="copy-button" type="button" class="btn btn-outline-secondary">
                            <i class="bi bi-clipboard me-1"></i><span id="copy-label">Copy</span>
                        </button>

                        <button id="clear-button" type="button" class="btn btn-outline-secondary">
                            <i class="bi bi-eraser me-1"></i>Clear
                        </button>
                    </div>

                </form>
            </div>
        </section>
    </main>

    <footer class="border-top bg-white py-3">
        <div class="container text-center text-muted small">
            Multi Translator &copy; 2026 - Built with Bootstrap 5 and JavaScript.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="data/translator-data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
